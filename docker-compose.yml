services:
  postgres:
    image: postgres:17
    container_name : expense_tracker_db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: dhruv
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
volumes:
  postgres_data: